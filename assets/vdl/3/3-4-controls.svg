<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>

    <!-- Metal Elements -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#999"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    
    <!-- Switch Gradients -->
    <radialGradient id="switch-base" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>

    <!-- Light Gradients -->
    <radialGradient id="white-light" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="80%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#ccc"/>
    </radialGradient>

    <radialGradient id="red-light" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="60%" stop-color="#d3211f"/>
      <stop offset="100%" stop-color="#8a0000"/>
    </radialGradient>

    <radialGradient id="blue-btn" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="70%" stop-color="#0062cc"/>
      <stop offset="100%" stop-color="#003c8f"/>
    </radialGradient>

    <radialGradient id="estop-red" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="60%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>

    <!-- Light Texture Pattern -->
    <pattern id="hex-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M2,0 L4,1 L4,3 L2,4 L0,3 L0,1 Z" fill="none" stroke="#000" stroke-width="0.3" opacity="0.15"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <filter id="heavy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.5"/>
    </filter>

    <!-- Components -->
    <g id="selector-switch" filter="url(#shadow)">
      <circle r="20" fill="url(#switch-base)" stroke="#444" stroke-width="1"/>
      <!-- Anahtar yönü orijinal fotoğraftaki gibi sağ-alta (135 derece) -->
      <g transform="rotate(135)">
        <path d="M-4.5,0 L-4.5,-22 A4.5,4.5 0 0,1 4.5,-22 L4.5,0 Z" fill="#151515" stroke="#333" stroke-width="0.5"/>
        <circle r="12" fill="#1a1a1a"/>
      </g>
    </g>

    <g id="digital-display" filter="url(#shadow)">
      <!-- Bezel -->
      <rect x="-65" y="-22" width="130" height="44" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/>
      <!-- Brand -->
      <text x="-56" y="-10" fill="#ddd" font-size="9" font-weight="bold" font-family="Arial, sans-serif">GEMO</text>
      <!-- Screen -->
      <rect x="-25" y="-12" width="55" height="26" fill="#080808"/>
      <!-- Mock Digits -->
      <text x="-18" y="6" fill="#ff2a2a" font-size="16" font-family="monospace">00.0</text>
      <text x="25" y="6" fill="#ff2a2a" font-size="9" font-family="monospace">°C</text>
      <text x="-56" y="16" fill="#aaa" font-size="6" font-family="Arial, sans-serif">DT-4420</text>
      <!-- Buttons -->
      <rect x="48" y="-12" width="8" height="5" rx="1" fill="#444"/>
      <rect x="48" y="-4" width="8" height="5" rx="1" fill="#444"/>
      <rect x="48" y="4" width="8" height="5" rx="1" fill="#444"/>
      <rect x="48" y="12" width="8" height="5" rx="1" fill="#444"/>
    </g>

    <g id="white-indicator" filter="url(#shadow)">
      <circle r="18" fill="url(#metal)" stroke="#888" stroke-width="1"/>
      <circle r="13" fill="url(#white-light)"/>
      <circle r="13" fill="url(#hex-pattern)"/>
    </g>

    <g id="red-indicator" filter="url(#shadow)">
      <circle r="18" fill="url(#metal)" stroke="#888" stroke-width="1"/>
      <circle r="13" fill="url(#red-light)"/>
      <circle r="13" fill="url(#hex-pattern)"/>
    </g>

    <g id="blue-reset" filter="url(#shadow)">
      <circle r="20" fill="url(#metal)" stroke="#666" stroke-width="1"/>
      <circle r="14" fill="url(#blue-btn)"/>
      <circle r="14" fill="none" stroke="#003c8f" stroke-width="1"/>
    </g>

    <g id="emergency-stop" filter="url(#heavy-shadow)">
      <!-- Yellow Base -->
      <circle r="42" fill="#fbd100" stroke="#d4b000" stroke-width="1.5"/>
      <!-- Text Paths -->
      <path id="estop-top-path" d="M -28,6 A 28,28 0 0,1 28,6" fill="none"/>
      <path id="estop-bot-path" d="M -28,-4 A 28,28 0 0,0 28,-4" fill="none"/>
      
      <text font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#d3211f">
        <textPath href="#estop-top-path" startOffset="50%" text-anchor="middle">EMERGENCY</textPath>
        <textPath href="#estop-bot-path" startOffset="50%" text-anchor="middle">STOP</textPath>
      </text>
      <!-- Mushroom Button -->
      <circle r="24" fill="url(#estop-red)" stroke="#8a0000" stroke-width="1"/>
      <!-- Small Hanging Key Detail -->
      <circle cx="0" cy="46" r="5" fill="none" stroke="#aaa" stroke-width="1.5"/>
      <path d="M-2.5,51 L2.5,51 L2.5,62 L0,62 L0,60 L-2.5,60 Z" fill="#bbb"/>
    </g>
  </defs>

  <!-- Dark Outer Context Background -->
  <rect width="100%" height="100%" fill="#1a1c1e"/>

  <!-- Main Panel Plate -->
  <rect x="30" y="20" width="680" height="960" rx="4" fill="url(#panel-bg)" stroke="#111" stroke-width="1.5"/>
  <!-- Inner Thin Black Line Frame -->
  <rect x="45" y="35" width="650" height="930" rx="2" fill="none" stroke="#111" stroke-width="1"/>

  <!-- Corner Screws -->
  <circle cx="55" cy="45" r="4" fill="#ddd" stroke="#777" stroke-width="1"/>
  <circle cx="685" cy="45" r="4" fill="#ddd" stroke="#777" stroke-width="1"/>
  <circle cx="55" cy="955" r="4" fill="#ddd" stroke="#777" stroke-width="1"/>
  <circle cx="685" cy="955" r="4" fill="#ddd" stroke="#777" stroke-width="1"/>

  <!-- HEADER -->
  <text x="370" y="150" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="95" fill="#d3211f" text-anchor="middle" letter-spacing="-2">Dolfin</text>
  <text x="370" y="195" font-family="Arial, sans-serif" font-weight="bold" font-size="19" fill="#111" text-anchor="middle" letter-spacing="0.5">INDUSTRIAL WASHING SYSTEMS</text>

  <!-- ==================== ORİJİNAL GENİŞ YERLEŞİM DÜZENİ ==================== -->
  
  <!-- ROW 1 (Y: 330) -->
  <use href="#selector-switch" x="160" y="330"/>
  <text x="160" y="380" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111" text-anchor="middle">WASHING HEATER</text>

  <use href="#digital-display" x="320" y="330"/>

  <use href="#selector-switch" x="480" y="330"/>
  <text x="480" y="380" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111" text-anchor="middle">WASH PUMP</text>

  <use href="#white-indicator" x="580" y="330"/>

  <!-- ROW 2 (Y: 530) -->
  <use href="#selector-switch" x="160" y="530"/>
  <text x="160" y="580" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111" text-anchor="middle">DRYING HEATER</text>

  <use href="#digital-display" x="320" y="530"/>

  <use href="#selector-switch" x="480" y="530"/>
  <text x="480" y="580" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111" text-anchor="middle">DRYING FAN</text>

  <use href="#white-indicator" x="580" y="530"/>

  <!-- ROW 3 (Y: 730) -->
  <use href="#selector-switch" x="160" y="730"/>
  <text x="160" y="780" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111" text-anchor="middle">DRUM</text>

  <!-- Ekranların tam altına denk gelen beyaz lamba (Yazısız) -->
  <use href="#white-indicator" x="320" y="730"/>

  <use href="#selector-switch" x="480" y="730"/>
  <text x="480" y="780" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111" text-anchor="middle">OIL SEPERATOR</text>

  <use href="#white-indicator" x="580" y="730"/>

  <!-- ROW 4 (Y: 900) -->
  <use href="#red-indicator" x="160" y="900"/>
  <text x="160" y="945" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111" text-anchor="middle">WASHING LEVEL</text>

  <!-- Tam ortada yer alan Reset butonu -->
  <use href="#blue-reset" x="370" y="900"/>
  <text x="370" y="945" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111" text-anchor="middle">RESET</text>

  <!-- Acil Stop sağ sütun hizasında -->
  <use href="#emergency-stop" x="580" y="900"/>

</svg>
