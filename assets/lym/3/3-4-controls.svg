<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1000" width="100%" height="100%">
  <defs>
    <!-- Filtreler ve Gölgeler -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inset-shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.5" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    
    <!-- Metal ve Renk Geçişleri -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eeeeee" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <linearGradient id="metal-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" />
      <stop offset="50%" stop-color="#999999" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    
    <radialGradient id="red-btn" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="80%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#800000"/>
    </radialGradient>
    <radialGradient id="green-btn" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4dff88"/>
      <stop offset="80%" stop-color="#00b33c"/>
      <stop offset="100%" stop-color="#006622"/>
    </radialGradient>
    <radialGradient id="blue-btn" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4db8ff"/>
      <stop offset="80%" stop-color="#007acc"/>
      <stop offset="100%" stop-color="#004c80"/>
    </radialGradient>
    <radialGradient id="white-btn" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#dddddd"/>
      <stop offset="100%" stop-color="#aaaaaa"/>
    </radialGradient>
    <radialGradient id="yellow-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffee66"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </radialGradient>
    <radialGradient id="led-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="30%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#800000"/>
    </radialGradient>
  </defs>

  <!-- Pano Arka Planı -->
  <rect x="20" y="20" width="360" height="940" rx="8" fill="url(#panel-bg)" stroke="#cccccc" stroke-width="2" filter="url(#drop-shadow)"/>
  
  <!-- Vidalar -->
  <circle cx="40" cy="40" r="5" fill="url(#metal-ring)" stroke="#666" stroke-width="1"/>
  <circle cx="360" cy="40" r="5" fill="url(#metal-ring)" stroke="#666" stroke-width="1"/>
  <circle cx="40" cy="940" r="5" fill="url(#metal-ring)" stroke="#666" stroke-width="1"/>
  <circle cx="360" cy="940" r="5" fill="url(#metal-ring)" stroke="#666" stroke-width="1"/>

  <!-- Logo -->
  <text x="200" y="80" font-family="Arial-Black, Arial, sans-serif" font-size="46" font-weight="900" fill="#cc0000" text-anchor="middle" letter-spacing="-1">Dolfin</text>
  <text x="200" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="1">ENDÜSTRİYEL YIKAMA SİSTEMLERİ</text>

  <!-- 1. SIRA: Acil Stop -->
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#cc0000" text-anchor="middle">ACİL STOP</text>
  <circle cx="200" cy="195" r="46" fill="url(#yellow-base)" stroke="#e6b800" stroke-width="2" filter="url(#drop-shadow)"/>
  <circle cx="200" cy="195" r="30" fill="url(#red-btn)" filter="url(#drop-shadow)"/>
  <circle cx="200" cy="188" r="20" fill="#ff4d4d" opacity="0.3"/> <!-- Işık Yansıması -->
  <path d="M 195 180 L 205 180 L 200 170 Z" fill="#fff" opacity="0.6"/> <!-- Ok yönü -->
  <path d="M 180 195 L 180 205 L 170 200 Z" fill="#fff" opacity="0.6" transform="rotate(-90 200 195)"/>
  
  <!-- 2. SIRA: Start/Stop & Zamanlayıcı -->
  <text x="120" y="275" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">YIKAMA</text>
  <text x="280" y="275" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">ZAMANLAYICI</text>

  <!-- Start/Stop Buton -->
  <rect x="100" y="290" width="40" height="76" rx="8" fill="url(#metal-dark)" filter="url(#drop-shadow)"/>
  <rect x="102" y="292" width="36" height="34" rx="6" fill="url(#green-btn)"/>
  <rect x="102" y="330" width="36" height="34" rx="6" fill="url(#red-btn)"/>
  <line x1="120" y1="302" x2="120" y2="316" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="347" r="6" stroke="#fff" stroke-width="3" fill="none"/>

  <!-- GEMO Zamanlayıcı -->
  <rect x="240" y="290" width="80" height="76" rx="4" fill="#111" stroke="url(#metal-ring)" stroke-width="3" filter="url(#inset-shadow)"/>
  <text x="248" y="308" font-family="sans-serif" font-size="8" fill="#888">DZ482</text>
  <text x="280" y="335" font-family="Courier, monospace" font-size="24" font-weight="bold" fill="#00ff00" text-anchor="middle" filter="drop-shadow(0 0 4px #00ff00)">15.0</text>
  <text x="248" y="355" font-family="sans-serif" font-size="9" fill="#888" font-weight="bold">GEMO</text>

  <!-- 3. SIRA: Test & Reset -->
  <text x="120" y="405" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">TEST</text>
  <text x="280" y="405" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">RESET</text>

  <!-- Test Butonu -->
  <circle cx="120" cy="445" r="24" fill="url(#metal-ring)" filter="url(#drop-shadow)"/>
  <circle cx="120" cy="445" r="18" fill="url(#white-btn)"/>
  
  <!-- Reset Butonu -->
  <circle cx="280" cy="445" r="24" fill="url(#metal-ring)" filter="url(#drop-shadow)"/>
  <circle cx="280" cy="445" r="18" fill="url(#blue-btn)"/>

  <!-- 4. SIRA: Isıtıcı & Termostat -->
  <text x="120" y="505" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">ISITICI</text>
  <text x="280" y="505" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">TERMOSTAT</text>

  <!-- Pako Şalter (Yeşil) -->
  <circle cx="120" cy="550" r="26" fill="url(#metal-dark)" filter="url(#drop-shadow)"/>
  <circle cx="120" cy="550" r="20" fill="#222"/>
  <rect x="115" y="528" width="10" height="44" rx="3" fill="url(#green-btn)" filter="url(#drop-shadow)"/>
  <circle cx="120" cy="550" r="6" fill="#111"/>

  <!-- GEMO Termostat -->
  <rect x="240" y="515" width="80" height="76" rx="4" fill="#111" stroke="url(#metal-ring)" stroke-width="3" filter="url(#inset-shadow)"/>
  <text x="248" y="533" font-family="sans-serif" font-size="8" fill="#888">DT481</text>
  <text x="280" y="560" font-family="Courier, monospace" font-size="24" font-weight="bold" fill="#ff3300" text-anchor="middle" filter="drop-shadow(0 0 4px #ff0000)">60.0</text>
  <text x="248" y="580" font-family="sans-serif" font-size="9" fill="#888" font-weight="bold">GEMO</text>

  <!-- 5. SIRA: Yağ Sıyırıcı -->
  <text x="200" y="625" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">YAĞ SIYIRICI</text>

  <!-- Pako Şalter (Siyah) -->
  <circle cx="120" cy="670" r="26" fill="url(#metal-dark)" filter="url(#drop-shadow)"/>
  <circle cx="120" cy="670" r="20" fill="#222"/>
  <rect x="115" y="648" width="10" height="44" rx="3" fill="#111" stroke="#333" stroke-width="1" filter="url(#drop-shadow)"/>
  <circle cx="120" cy="670" r="6" fill="#000"/>
  
  <!-- Kör Tapa -->
  <circle cx="280" cy="670" r="14" fill="url(#metal-ring)" filter="url(#drop-shadow)"/>
  <circle cx="280" cy="670" r="10" fill="#cccccc" filter="url(#inset-shadow)"/>

  <!-- 6. SIRA: Uyarı Lambaları -->
  <text x="100" y="735" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#cc0000" text-anchor="middle">DÜŞÜK SU SEVİYESİ</text>
  <circle cx="100" cy="760" r="12" fill="url(#metal-ring)" filter="url(#drop-shadow)"/>
  <circle cx="100" cy="760" r="8" fill="url(#led-red)"/>

  <text x="200" y="735" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#cc0000" text-anchor="middle">REDÜKTÖR ARIZASI</text>
  <circle cx="200" cy="760" r="12" fill="url(#metal-ring)" filter="url(#drop-shadow)"/>
  <circle cx="200" cy="760" r="8" fill="url(#led-red)"/>

  <text x="300" y="735" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#cc0000" text-anchor="middle">POMPA ARIZASI</text>
  <circle cx="300" cy="760" r="12" fill="url(#metal-ring)" filter="url(#drop-shadow)"/>
  <circle cx="300" cy="760" r="8" fill="url(#led-red)"/>

  <!-- 7. SIRA: Ana Şalter -->
  <text x="200" y="805" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">ANA ŞALTER</text>
  
  <rect x="160" y="815" width="80" height="80" rx="6" fill="url(#yellow-base)" stroke="#e6b800" stroke-width="2" filter="url(#drop-shadow)"/>
  <circle cx="200" cy="855" r="30" fill="url(#red-btn)" filter="url(#drop-shadow)"/>
  <rect x="192" y="825" width="16" height="60" rx="4" fill="#990000" filter="url(#drop-shadow)"/>
  <circle cx="200" cy="855" r="8" fill="#4d0000"/>

  <!-- Alt Firma Bilgileri -->
  <text x="40" y="915" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#555">CNK ELEKTRİK</text>
  <text x="360" y="915" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="end">CE</text>
</svg>
