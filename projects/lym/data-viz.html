OK","YOK","YOK","YOK"]},{"feature":"LYM 1500","cells":["YOK","YOK","YOK","YOK"]}]},"motors":{},"bom":{},"notes":["Varyant bazli urun parametreleri","Varyant | Ürün A | Ürün B | Ürün C | Reçete no listesi"]},"BAKIM_GENEL":{"kv":[{"k":"Bakım felsefesi (önleyici / kestirimci)","v":"ÖNLEYİCİ"},{"k":"Bakım personeli yeterlilik seviyesi","v":""},{"k":"Lubrication chart dosya referansı","v":"YOK"}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"BAKIM_PERIYOT":{"kv":[{"k":"Günlük bakım maddeleri","v":""},{"k":"Haftalık bakım maddeleri","v":""},{"k":"Aylık bakım maddeleri","v":""},{"k":"250 saat bakım maddeleri","v":""},{"k":"500 saat bakım maddeleri","v":""},{"k":"1000 saat bakım maddeleri","v":""},{"k":"Yıllık bakım maddeleri","v":""}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"BAKIM_YAGLAMA":{"kv":[{"k":"Yağlama noktası listesi (konum / yağ tipi / periyot)","v":""},{"k":"Gres tipi","v":""},{"k":"Redüktör yağ değişim","v":""}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"BAKIM_YEDEK_PARCA":{"kv":[{"k":"Kritik yedek parça listesi","v":"Bkz. [PARCA_LISTESI] — varyant bazlı tam BOM (Bölüm 13.3)"},{"k":"Önerilen stok miktarları","v":"[EKSİK] — montaj adetleri [PARCA_LISTESI]'nde; stok seviyeleri kullanıcı tarafından belirlenecek"},{"k":"Yedek parça sipariş kodu referansı","v":"[PARCA_LISTESI] «Sipariş kodu» sütunu"}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"BAKIM_YEDEK_PARCA_NOT":{"kv":[],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":["Tam liste SSOT: [PARCA_LISTESI] → Bölüm 13.3. Montaj adedi = makinedeki parça sayısı. «Alternatif» = konfigürasyona göre biri; «Opsiyon» = donanıma bağlı."]},"TEMIZLIK":{"kv":[{"k":"Temizlik tipi (kuru / ıslak / CIP / COP)","v":"Kuru / ıslak — CIP / COP bulunmamaktadır. Temizlik manuel uygulanır; makine dış yüzeyleri kuru bez ile silinir, tank içi ıslak temizlik (su, sabunlu su) gerektirir. Elektrik panosu, dijital göstergeler (GEMO DT481, DZ482) ve kapak switch bölgelerine doğrudan su püskürtmeyin."},{"k":"Temizlik öncesi güvenlik","v":"1. Makineyi kırmızı Stop butonu ile durdurun. 2. Ana şalteri OFF (0) konumuna alın. 3. LOTO uygulayın (Bkz. Bölüm 2.4). 4. Kapak emniyet switchini / interlock kilidi bypass etmeyin. 5. Uzun süreli temizlik veya dezenfeksiyon öncesi tankı boşaltın (otomatik boşaltma donanımlıysa kullanın; değilse drenaj vanası ile). UYARI — Sıcak yüzey ve buhar: Kapak açılmadan proses suyunun güvenli sıcaklığa inmesini bekleyin; koruyucu eldiven kullanın. UYARI — Kimyasal: Yalnızca onaylı temizlik maddelerini kullanın (aşağıda)."},{"k":"Günlük temizlik prosedürü","v":"Periyot: günlük (Bkz. Bölüm 9.1.3). Kapsam: yıkama tankı ön filtreleri — bunun dışında günlük başka temizlik gerekmez. Yedek parça: LYM 950 → 07 01221 ÖN FİLTRE KOMPLESİ; LYM 1150 / 1350 / 1500 → 07 10214 ÖN FİLTRE NS KOMPLESİ (önerilen stok: [EKSİK] — Bkz. Bölüm 9.1.6). Adımlar: 1. Makineyi durdurun; LOTO uygulayın. 2. Yıkama tankı ön filtrelerini sökün. 3. Filtreleri şebeke suyu ve onaylı temizlik maddeleriyle temizleyin; yüksek basınçlı su veya fırça kullanılabilir. 4. Deformasyon veya yırtık varsa yedek parça ile değiştirin. 5. Filtreleri doğru yönde takın. 6. LOTO kaldırın; sızıntı olmadığını kontrol edin. Beklenen sonuç: ön filtreler temiz, pompa emişinde anormal gürültü/tıkanma yok."},{"k":"Haftalık derin temizlik","v":"Periyot: haftalık (Bkz. Bölüm 9.1.3). Kapsam: emiş filtresi + hassas filtre (donanımlı makinelerde) torba filtresi + yağ sıyırıcı tank yüzeyi. Yedek parça: emiş → LYM 950: 07 00800 EMİŞ FİLTRESİ KOMPLESİ (PYM 1); LYM 1150 / 1350 / 1500: 07 00670 EMİŞ FİLTRESİ KOMPLESİ; torba filtre (hassas filtre opsiyonu): 10 05378 TORBA FİLTRE 200 MİKRON (önerilen stok: [EKSİK]). Adımlar: 1. Makineyi durdurun; LOTO uygulayın. 2. Emiş filtresini çıkartın; temizleyin veya hasarlıysa değiştirin. 3. Hassas filtre donanımlıysa pompa çıkışı torba filtresini sökün; temizleyin veya değiştirin. 4. Contaları ve sızdırmazlığı kontrol edin. 5. Günlük ön filtre temizliğini (yukarı) aynı turda uygulayın. 6. Yağ sıyırıcı donanımlıysa tank yüzeyinde aşırı yağ tabakasını temizleyin. Beklenen sonuç: filtreler temiz veya yeni; pompa debisi normal; sızıntı yok."},{"k":"Temizlik suyu","v":"Makine temizliği için şebeke suyu kullanılabilir. Proses suyu kaynağı: şebeke suyu (Bkz. Bölüm 3.3.5 — su kalitesi / filtre gereksinimi)."},{"k":"Kullanılan temizlik maddeleri (genel kriter)","v":"Paslanmaz çelik uyumlu nötr veya hafif alkalî deterjanlar."},{"k":"Üretici önerilen temizlik maddeleri","v":"VEIDEC 89 SUPER FOAM 750 — genel temizlik; VEIDEC BIO CLEANING 3 — çıkmayan inatçı lekeler (az miktarda ıslatılmış sünger ile ovma); VEIDEC 34 INOX — parlatma. Ürün talimatlarına (dozaj, bekleme, durulama) uyun; kimyasalı doğrudan pano, dijital gösterge ve kapak switch bölgelerine uygulamayın."},{"k":"Müşteri eşdeğer ürün","v":"Asit bazlı olmayan ve makineye (paslanmaz çelik, tank, conta) zarar vermeyen temizlik maddeleri kullanılabilir."},{"k":"Yasak temizlik maddeleri","v":"Asit bazlı temizlik maddeleri kullanılmamalıdır. Paslanmaz çeliğe zarar verecek temizlik maddeleri kullanılmamalıdır."},{"k":"Dezenfeksiyon prosedürü","v":"Uygulama: uzun süreli duruş, periyodik hijyen veya tank koku/kirlilik birikiminde. Yöntem: tank boşaltma + sabunlu su ile iç yıkama. Adımlar: 1. Makineyi durdurun; LOTO uygulayın. 2. Yıkama tankındaki proses suyunu tamamen boşaltın. 3. Tank iç yüzeylerini sabunlu su ile yıkayın; paslanmaz yüzeylere uygun yumuşak fırça veya bez kullanın. 4. Sabunlu suyu drenaj hattına boşaltın. 5. Tank içerisini temiz su ile durulayın. 6. Tank içini kurumaya bırakın veya uygun yöntemle kurutun. 7. Makine dış yüzeyini kuru bez ile silin. 8. Atık suyu yerel mevzuata uygun bertaraf edin. DİKKAT: Tank içi dezenfeksiyonda sabonlu su yöntemi geçerlidir; asit bazlı dezenfektan yasaktır."},{"k":"Temizlik sonrası kurutma","v":"Makine dışı kuru bez ile silinmelidir. Tank içi boşaltma sonrası doğal kuruma veya uygun kurutma. Elektrik panosu / dijital göstergeler su ile yıkanmaz — yalnızca kuru veya hafif nemli bez. Kurutma tamamlandıktan sonra LOTO kaldırılır; devreye alma Bölüm 7.2 prosedürüne göre yapılır."},{"k":"Atık su / kimyasal bertaraf","v":"Makinenin kullanıldığı ülkenin mevcut atık su / kimyasal bertaraf gereksinimleri uygulanmalıdır. Tank boşaltma suyu, sabunlu yıkama suyu ve filtre temizlik atıkları yerel çevre izinleri kapsamında toplanmalı ve arıtılmalıdır."},{"k":"Temizlik kayıt formu (özet)","v":"1. Yıkama tankı ön filtre temizliği — günlük. 2. Emiş filtresi temizliği/değişimi — haftalık. 3. Torba filtre temizliği/değişimi (hassas filtre opsiyonu) — haftalık. 4. Dezenfeksiyon (sabunlu su) — gerektiğinde. 5. Dış yüzey kurutma — her temizlik sonrası."}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":["Tüm LYM varyantları (950 / 1150 / 1350 / 1500) ortak. Kılavuz Bölüm 10 SSOT. LOTO → Bölüm 2.4 (adımları tekrarlama).","=============================================================================","11 — ARIZA GİDERME (troubleshooting)","============================================================================="]},"ARIZA_GENEL":{"kv":[{"k":"Arıza lambaları (geri bildirimli — pano üzerinde)","v":""},{"k":"- Düşük su seviyesi","v":"Tank su seviyesi güvenli çalışma sınırının altında"},{"k":"- Redüktör arızası","v":"Sepet redüktör termik rölesi atmış"},{"k":"- Pompa arızası","v":"Yıkama pompası termik rölesi atmış"},{"k":"Geri bildirimsiz motor koruması (pano içi termik — arıza lambası yok)","v":""},{"k":"Genel teşhis sırası","v":""},{"k":"HMI alarm metinleri dili","v":"Uygulanmaz (dijital alarm ekranı yok)"},{"k":"Servis çağrısı kriterleri","v":"Termik reset sonrası aynı arıza tekrarlıyorsa; boşta çalıştırmada dahi redüktör/pompa aşırı akım çekiyorsa; kaçak akım hangi devrede olursa olsun tekrar atıyorsa; kapak switch değişimi/kablolama onarımı gerekiyorsa ve yetkili bakım personeli yoksa; motor iç hasar veya pompa mekanik hasar şüphesi varsa — Bkz. Bölüm 1.3 iletişim"}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":["LYM serisi dijital HMI alarm kodu kullanmaz; arıza bildirimi kontrol panosu üzerindeki kırmızı arıza lambaları ve emniyet devresi davranışı ile yapılır. Tüm varyantlar (LYM 950 / 1150 / 1350 / 1500) için aşağıdaki teşhis adımları ortaktır."]},"ARIZA_TABLO":{"kv":[{"k":"Arıza 1 belirti","v":"Redüktör arıza lambası yanıyor; sepet dönmüyor veya yıkama start almıyor"},{"k":"Arıza 1 neden","v":"Sepet redüktör termik rölesi atmış (aşırı akım). Olası nedenler: sepet gereğinden fazla yüklenmiş; sepet veya tahrik mekanizması takılmış; redüktör motoru iç hasarlı"},{"k":"Arıza 1 çözüm","v":"1. Makineyi durdurun. 2. Sepet yükünü azaltın; mekanik takılma varsa giderin. 3. Termik röleyi resetleyin. 4. Sepeti boşaltın; TEST (jog) veya yıkama ile boşta çalıştırmayı deneyin — motor takılıyor mu gözlemleyin. 5. Ampermetre ile motor akımını ölçün; normal aralıktaysa sorun giderilmiştir. Tekrarlıyorsa motor/redüktör servis kontrolü — Bkz. Bölüm 13.3 yedek parça"},{"k":"Arıza 2 belirti","v":"Pompa arıza lambası yanıyor; yıkama pompası çalışmıyor"},{"k":"Arıza 2 neden","v":"Yıkama pompası termik rölesi atmış (aşırı akım). Olası nedenler: pompa zorlanmış; filtre hattı tıkanmış; pompa salmastrası veya mekanik kısmı hasarlı; emiş hattında tıkanıklık"},{"k":"Arıza 2 çözüm","v":"1. Makineyi durdurun. 2. Ön filtre ve emiş filtresini kontrol edin; tıkanıklığı giderin. 3. Pompa çıkış hattı ve hassas filtre (donanımlıysa) tıkanıklığını kontrol edin. 4. Pompa salmastrasında sızıntı veya anormal ses olup olmadığını kontrol edin. 5. Termik röleyi resetleyin; kısa süreli test çalıştırması yapın. 6. Akım normal ise sorun giderilmiştir; tekrarlıyorsa pompa servis kontrolü — Bkz. Bölüm 13.3"},{"k":"Arıza 3 belirti","v":"Düşük su seviyesi arıza lambası yanıyor; ısıtıcı ve/veya pompa devreye girmiyor"},{"k":"Arıza 3 neden","v":"Yıkama tankındaki su seviyesi güvenli çalışma sınırının altında; seviye bekçisi (float switch) düşük seviye sinyali veriyor"},{"k":"Arıza 3 çözüm","v":"1. Tank su seviyesini kontrol edin. 2. Gerekli miktarda su ilave edin. 3. Seviye güvenli sınıra ulaştıktan sonra mavi Reset butonuna basarak emniyet devresini onaylayın. 4. Isıtıcı ve yıkama prosesini tekrar başlatın"},{"k":"Arıza 4 belirti","v":"Opsiyonel ekipman (kurutma fanı, drenaj pompası, yağ sıyırıcı, buhar tahliye fanı vb.) çalışmıyor; pano üzerinde ilgili arıza lambası yok"},{"k":"Arıza 4 neden","v":"İlgili motor termik rölesi atmış olabilir; arıza lambası bu devrelerde bulunmaz"},{"k":"Arıza 4 çözüm","v":"1. Ana şalteri kapatın; LOTO uygulayın (Bkz. Bölüm 2.4). 2. Pano kapağını açın. 3. İlgili motor devresindeki termik röleyi bulun; atmışsa resetleyin. 4. Nedeni araştırın (tıkanıklık, aşırı yük, mekanik sıkışma — redüktör/pompa arızaları ile aynı mantık). 5. LOTO kaldırın; fonksiyonu tek başına test edin"},{"k":"Arıza 5 belirti","v":"Kaçak akım koruma cihazı (RCD / kaçak akım rölesi) atıyor; makine veya bir fonksiyon devreye girmiyor"},{"k":"Arıza 5 neden","v":"Bir devrede yalıtım hatası veya kaçak akım; hangi yük devreye girdiğinde attığı tespit edilmeli"},{"k":"Arıza 5 çözüm","v":"1. Tüm fonksiyonları kapalı konuma getirin. 2. Kaçak akım rölesini resetleyin. 3. Tek tek fonksiyonları devreye alın (ör. yalnız redüktör jog, yalnız pompa, yalnız ısıtıcı). 4. Hangi fonksiyonda röle tekrar attıysa arızalı devreyi izole edin. 5. O devrede motor, rezistans, kablo ve bağlantıları kontrol edin. 6. Isolasyon ölçümü gerekiyorsa yetkili elektrik personeli devreye alın — tekrarlayan kaçak akımda servis çağırın"},{"k":"Arıza 6 belirti","v":"Kapak kapalı olmasına rağmen makine yıkama start almıyor"},{"k":"Arıza 6 neden","v":"Kapak emniyet switchi (EMAS L5K13MUM331) arızalı veya kapak kapalı sinyali emniyet devresine ulaşmıyor"},{"k":"Arıza 6 çözüm","v":"1. Kapağın tam kapandığından ve kilit mekanizmasının oturduğundan emin olun. 2. Switch kapağını açın; multimetre direnç modunda kapak kapalı/kapalı konumda kontak geçişini ölçün — sinyal gelmiyorsa switch arızalıdır. 3. Switch ve kablo bağlantılarını kontrol edin. 4. Switch değişimi gerekiyorsa yetkili bakım personeli uygulasın — Bkz. Bölüm 13.3 (10 00261 / 10 03262 / 10 00260, modele göre). 5. Onarım sonrası emniyet fonksiyon testi yapın (Bkz. Bölüm 5.3)"},{"k":"Arıza 7 belirti","v":"Su ısınmıyor; GEMO DT481 termostat ekranında sıcaklık (PV) yükselmiyor veya hedef sıcaklığa (SV) ulaşılamıyor"},{"k":"Arıza 7 neden","v":"Isıtıcı devresi devreye girmiyor veya devreye girmesine rağmen rezistans ısıtmıyor. Olası nedenler: su zaten hedef/üst sınıra ulaşmış (normal — kontaktör çekmez); düşük su seviyesi (Bkz. Arıza 3); ısıtıcı pako şalteri kapalı; termostat (GEMO DT481) arızalı; rezistans komple arızalı (patlamış/kırık)"},{"k":"Arıza 7 çözüm","v":"1. Düşük su seviyesi lambasını kontrol edin; yanıyorsa önce Arıza 3 adımlarını uygulayın. 2. GEMO DT481 ekranından anlık sıcaklık (PV) ile hedef sıcaklık (SV) değerlerini okuyun. 3. PV ≥ SV ise su hedef sıcaklığa ulaşmıştır; ısıtıcı kontaktörünün çekmemesi normaldir — arıza değildir. 4. PV üst sıcaklık limitine (maks. 70 °C) ulaştıysa kontaktör çekmez; bu da normaldir. 5. PV < SV ve limit altındaysa pano üzerindeki ISITICI pako şalterinin açık (1) konumda olduğunu kontrol edin; kapalıysa açın. 6. Şalter açık, PV < SV iken pano içinde ısıtıcı kontaktörünün çekip çekmediğini gözlemleyin. 7. Kontaktör çekiyor ancak su ısınmıyorsa rezistans arızalıdır (patlamış olabilir) — LOTO uygulayın (Bkz. Bölüm 2.4), rezistans komplesi değiştirilsin — Bkz. Bölüm 13.3 (07 00309). 8. Kontaktör çekmiyorsa GEMO DT481 termostat çıkış sinyalini ölçü aleti ile kontrol edin; cihaz çıkış vermiyorsa termostat arızalıdır — değiştirin veya servis. 9. Termostat çıkış veriyor, şalter açık, kontaktör yine çekmiyorsa kontaktör, termik ve kablolamayı kontrol edin — yetkili elektrik personeli"}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":["Format: Belirti | Olası neden | Kontrol | Çözüm — tüm LYM varyantları ortak"]},"ELEKTRIK_ARIZA":{"kv":[{"k":"Faz kaybı davranışı","v":"[EKSİK] — faz monitörü donanımlı makinelerde faz kaybında motorlar devre dışı kalabilir; elektrik şemasına bakın (Bölüm 13.2)"},{"k":"Motor koruma trip","v":"Termik aşırı yük röleleri. LYM 950: sepet redüktör LR2K0310 (2,60–3,7 A); yıkama pompası LR2K0312 (3,70–5,5 A) — Bkz. [KAPASITE_PROSES] nominal akım. LYM 1150 / 1350 / 1500 pompa termik ayarı pano içi [EKSİK]. Opsiyon motorlar (kurutma, yağ sıyırıcı, buhar tahliye vb.) ayrı termik. Trip = aşırı akım veya ısınma. Reset sonrası neden giderilmeden tekrar çalıştırmayın. Geri bildirimli lambalar: redüktör, pompa — Bkz. Arıza 1–2"},{"k":"Inverter alarm kodları özeti","v":"Uygulanmaz — LYM serisi yıkama pompası ve sepet tahriki DOL motor; inverter yok"},{"k":"Kaçak akım teşhisi","v":"Fonksiyonları tek tek ayırarak arızalı devreyi bulun — Bkz. Arıza 5"},{"k":"Sensör kablo renk kodu","v":"Bkz. elektrik şeması — teslim paketi (Bölüm 13.2)"}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"HIDROLIK_ARIZA":{"kv":[{"k":"Basınç düşük alarm","v":"Uygulanmaz — basınç switchi yok; pompa çalışmıyorsa Bkz. Arıza 2"},{"k":"Yağ kaçağı noktaları","v":"Pompa salmastrası, tank bağlantıları, vana contaları — pompa zorlanması ve termik trip nedeni olabilir"},{"k":"Pompa sesi anormal","v":"Emiş tıkanıklığı, kuru çalışma (düşük su — Bkz. Arıza 3), yataksızlık veya yabancı cisim — servis"}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"PNEOMATIK_ARIZA":{"kv":[{"k":"Basınç düşük","v":"Uygulanmaz — standart LYM konfigürasyonunda pnömatik devre yok"},{"k":"Silindir yavaş / takılma","v":"Uygulanmaz"},{"k":"Valf bobini arıza","v":"Uygulanmaz"}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"SENSOR_ARIZA":{"kv":[{"k":"Kritik sensör listesi (tip / konum)","v":"Kapak switch EMAS L5K13MUM331 (950/1150) veya L5K13MEP123 + L5K27MUM331 (1350/1500) — kapak emniyeti; Paslanmaz seviye bekçisi 10 00296 — tank düşük su (Bkz. Arıza 3); Termokupl ETB30F06-2Ç — tank sıcaklık"},{"k":"Sensör LED / durum göstergesi","v":"Kapak switch — multimetre direnç modunda kapak açık/kapalı kontak durumu ölçülür (Bkz. Arıza 6); Seviye bekçisi — tank su seviyesi fiziksel kontrol; termokupl ETB30F06-2Ç — GEMO DT481 ekranından PV/SV okunur; termostat çıkışı — ölçü aleti ile kontrol (Bkz. Arıza 7)"}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":["=============================================================================","12 — DEMONTAJ (dismantle)","============================================================================="]},"DEMONTAJ":{"kv":[{"k":"Demontaj ön koşulları","v":""},{"k":"Enerji izolasyon prosedürü (LOTO)","v":""},{"k":"Demontaj sırası","v":""},{"k":"Geri dönüşüm / bertaraf talimatı","v":""},{"k":"Tehlikeli madde (yağ / akü / kimyasal)","v":""},{"k":"Çevresel bertaraf gereksinimleri","v":""}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"DEVRE_DISI":{"kv":[{"k":"Kalıcı devre dışı bırakma","v":""},{"k":"Geçici devre dışı bırakma","v":""}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},"HURDA":{"kv":[{"k":"Hurda değerlendirme","v":""},{"k":"Parça geri dönüşüm malzemeleri","v":""}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":["=============================================================================","13 — DÖKÜMANLAR (documents)","============================================================================="]},"DOKUMANLAR":{"kv":[{"k":"Elektrik şeması dosya adı / rev","v":""},{"k":"Pnömatik şema dosya adı / rev","v":""},{"k":"Hidrolik şema dosya adı / rev","v":""},{"k":"Layout çizimi dosya adı / rev","v":""},{"k":"Parça listesi (BOM) dosya adı / rev","v":""},{"k":"I/O listesi dosya adı / rev","v":""},{"k":"PLC program yedek dosya adı","v":""},{"k":"HMI proje yedek dosya adı","v":""},{"k":"CE dosyası referansı","v":""},{"k":"Kalibrasyon sertifikaları","v":""},{"k":"P&ID dosya adı / rev","v":""}],"table":{"cols":[],"rows":[]},"motors":{},"bom":{},"notes":[]},   <style>
    :root {
      --bg: #0e1216;
      --bg2: #141a20;
      --panel: #1b232c;
      --line: #2a3542;
      --text: #e7eef6;
      --muted: #8b9aab;
      --accent: #5d8fd4;
      --ok: #3ecf8e;
      --warn: #e0b04a;
      --bad: #e15b5b;
      --chip: #243040;
      --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
    a { color: var(--accent); }
    header {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .02em; }
    header h1 span { color: var(--muted); font-weight: 500; }
    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .kpi {
      background: var(--chip); border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 10px; min-width: 92px;
    }
    .kpi b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
    .kpi small { color: var(--muted); font-size: 11px; }
    nav {
      display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 20px;
      border-bottom: 1px solid var(--line); background: var(--bg);
      position: sticky; top: 53px; z-index: 19;
    }
    nav button {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: 6px 10px; border-radius: 4px; cursor: pointer; font: inherit;
    }
    nav button:hover { color: var(--text); background: var(--chip); }
    nav button.active { color: var(--text); border-color: var(--line); background: var(--panel); }
    main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    section { margin-bottom: 28px; }
    section h2 {
      margin: 0 0 12px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); font-weight: 650;
    }
    .grid { display: grid; gap: 14px; }
    .g2 { grid-template-columns: 1.2fr 1fr; }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 1100px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    }
    .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 650; }
    .card p.cap { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    svg { display: block; width: 100%; height: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
    .eksik { color: var(--bad); }
    .empty { color: var(--warn); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--line); background: var(--chip); color: var(--text);
      border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px;
    }
    .chip.on { border-color: var(--accent); background: #243a58; }
    .bar-row { display: grid; grid-template-columns: 92px 1fr 64px; gap: 8px; align-items: center; margin: 6px 0; }
    .bar-row span { font-size: 12px; color: var(--muted); }
    .bar-row b { font-family: var(--mono); font-size: 12px; text-align: right; }
    .track { height: 10px; background: #10161c; border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; border-radius: 99px; }
    input[type=search] {
      width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
      border-radius: 6px; padding: 8px 10px; font: inherit; margin-bottom: 10px;
    }
    .meta { color: var(--muted); font-size: 12px; }
    .stack { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: #10161c; }
    .stack i { display: block; height: 100%; }
    .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
    .flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .flow .step {
      background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 140px;
    }
    .flow .step b { display: block; font-size: 12px; color: var(--muted); }
    .arrow { color: var(--muted); }
    .machine-row { display: flex; gap: 12px; align-items: flex-end; justify-content: space-around; flex-wrap: wrap; }
    footer { padding: 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  </style>
</head>

    <button data-go="elektrik">Elektrik / pompa</button>
    <button data-go="yerlesim">Yerleşim</button>
    <button data-go="guvenlik">Güvenlik</button>
    <button data-go="doluluk">Doluluk</button>
    <button data-go="bom">Parça listesi</button>
    <button data-go="kesfet">Blok gezgini</button>
  </nav>
  <main id="app"></main>
  <footer>Kaynak: <code>LYM DATA</code> — bu sayfaya gömülü statik anlık görüntü.</footer>
  <script>
  const COLORS = ["#5d8fd4", "#3ecf8e", "#e0b04a", "#e15b5b", "#a78bfa", "#22d3ee"];
  let DATA = {};
  let variantOn = {};

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const block = (name) => (DATA.blocks && DATA.blocks[name]) || { kv: [], table: { cols: [], rows: [] }, motors: {}, bom: {}, notes: [] };
  const kv = (name, key) => {
    const hit = block(name).kv.find((x) => x.k === key || x.k.toLowerCase().includes(key.toLowerCase()));
    return hit ? hit.v : "";
  };
  const row = (name, feat) => {
    const r = block(name).table.rows.find((x) => x.feature === feat || x.feature.toLowerCase().includes(feat.toLowerCase()));
    return r ? r.cells : [];
  };
  const num = (v) => {
    if (v == null) return null;
    const s = String(v).trim();
    if (!s || /\[EKSİK\]/i.test(s) || /^(yok)$/i.test(s)) return null;
    const m = s.replace(/\s/g, "").replace(",", ".").match(/-?\d+(?:\.\d+)?/);
    return m ? Number(m[0]) : null;
  };
  const statusClass = (v) => {
    const s = String(v ?? "").trim();
    if (!s) return "empty";
    if (/\[EKSİK\]/i.test(s)) return "eksik";
    return "";
  };
  const cell = (v) => `<td class="${statusClass(v)}">${esc(v || "—")}</td>`;
  const variants = () => (DATA.variants || []).filter((v) => variantOn[v] !== false);
  const idxOf = (name) => (DATA.variants || []).indexOf(name);

  function kpis() {
    const c = DATA.completeness || { filled: 0, empty: 0, eksik: 0, total: 0 };
    const pct = c.total ? Math.round((c.filled / c.total) * 100) : 0;
    const bomN = Object.values(block("PARCA_LISTESI").bom).reduce((n, arr) => n + arr.length, 0);
    $("kpis").innerHTML = [
      kpi(DATA.variants?.length || 0, "varyant"),
      kpi(pct + "%", "alan dolu"),
      kpi(c.eksik, "[EKSİK]"),
      kpi(c.empty, "boş alan"),
      kpi(bomN, "BOM satırı"),
    ].join("");
  }
  function kpi(v, l) { return `<div class="kpi"><b>${esc(v)}</b><small>${esc(l)}</small></div>`; }

  function barChart(title, items, unit) {
    const max = Math.max(1, ...items.map((x) => x.n || 0));
    const rows = items.map((x, i) => {
      const w = ((x.n || 0) / max) * 100;
      const col = COLORS[i % COLORS.length];
      const label = x.n == null ? "—" : x.n + (unit ? " " + unit : "");
      return `<div class="bar-row"><span>${esc(x.label)}</span><div class="track"><div class="fill" style="width:${w}%;background:${col}"></div></div><b>${esc(label)}</b></div>`;
    }).join("");
    return `<div class="card"><h3>${esc(title)}</h3>${rows}<p class="cap">Kaynak: LYM DATA</p></div>`;
  }

  function isoMachines() {
    const w = row("BOYUT_AGIRLIK", "Dış genişlik");
    const l = row("BOYUT_AGIRLIK", "Dış uzunluk");
    const h = row("BOYUT_AGIRLIK", "Dış yükseklik");
    const vis = variants();
    const dims = vis.map((name) => {
      const i = idxOf(name);
      return { name, W: num(w[i]), L: num(l[i]), H: num(h[i]), i };
    });
    const max = Math.max(1, ...dims.flatMap((d) => [d.W, d.L, d.H].filter(Boolean)));
    const svgs = dims.map((d) => {
      const sc = 90 / max;
      const ww = (d.W || 1) * sc, ll = (d.L || 1) * sc, hh = (d.H || 1) * sc;
      const ox = 70, oy = 140;
      const isoX = (x, y) => ox + (x - y) * 0.86;
      const isoY = (x, y, z) => oy + (x + y) * 0.5 - z;
      const p = (x, y, z) => `${isoX(x, y).toFixed(1)},${isoY(x, y, z).toFixed(1)}`;
      const top = `${p(0,0,hh)} ${p(ww,0,hh)} ${p(ww,ll,hh)} ${p(0,ll,hh)}`;
      const left = `${p(0,0,0)} ${p(0,0,hh)} ${p(0,ll,hh)} ${p(0,ll,0)}`;
      const right = `${p(0,ll,0)} ${p(0,ll,hh)} ${p(ww,ll,hh)} ${p(ww,ll,0)}`;
      const col = COLORS[d.i % COLORS.length];
      return `<div style="text-align:center;min-width:160px">
        <svg viewBox="0 0 160 170" width="160" height="170">
          <polygon points="${left}" fill="${col}55" stroke="${col}" />
          <polygon points="${right}" fill="${col}88" stroke="${col}" />
          <polygon points="${top}" fill="${col}" stroke="${col}" />
        </svg>
        <div><b>${esc(d.name)}</b></div>
        <div class="meta">${d.W || "?"} × ${d.L || "?"} × ${d.H || "?"} mm</div>
      </div>`;
    }).join("");
    return `<div class="card"><h3>Dış ölçü karşılaştırması (W × L × H)</h3>
      <div class="machine-row">${svgs}</div>
      <p class="cap">Ölçek göreli; değerler [BOYUT_AGIRLIK] tablosundan. Elektrik kutusu hariç.</p></div>`;
  }

  function specTable(title, blockName, features) {
    const cols = variants();
    const allCols = DATA.variants || [];
    const head = `<tr><th>Özellik</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
    const rows = features.map((f) => {
      const cells = row(blockName, f);
      return `<tr><td>${esc(f)}</td>${cols.map((c) => cell(cells[allCols.indexOf(c)] || "")).join("")}</tr>`;
    }).join("");
    return `<div class="card"><h3>${esc(title)}</h3><div style="overflow:auto"><table>${head}${rows}</table></div></div>`;
  }

  function layoutCard() {
    const vis = variants();
    const w = row("BOYUT_AGIRLIK", "Dış genişlik");
    const l = row("BOYUT_AGIRLIK", "Dış uzunluk");
    const front = num(kv("LAYOUT", "Minimum etraf boşluğu — ön")) || 1000;
    const back = num(kv("LAYOUT", "Minimum etraf boşluği — arka")) || num(kv("LAYOUT", "Minimum etraf boşluğu — arka")) || 1000;
    const side = num(kv("LAYOUT", "Minimum etraf boşluğu — yan")) || 1000;
    const boxes = vis.map((name, vi) => {
      const i = idxOf(name);
      const W = num(w[i]) || 1000, L = num(l[i]) || 1000;
      const tw = W + side * 2, tl = L + front + back;
      const max = Math.max(tw, tl);
      const sc = 220 / max;
      const mx = 20 + side * sc, my = 20 + back * sc;
      const col = COLORS[i % COLORS.length];
      return `<div class="card"><h3>${esc(name)} yerleşim payı</h3>
        <svg viewBox="0 0 260 260" width="260" height="260">
          <rect x="20" y="20" width="${tw*sc}" height="${tl*sc}" fill="#10161c" stroke="#3a4a5c" stroke-dasharray="4 3"/>
          <rect x="${mx}" y="${my}" width="${W*sc}" height="${L*sc}" fill="${col}66" stroke="${col}"/>
          <text x="${mx + W*sc/2}" y="${my + L*sc/2}" text-anchor="middle" fill="#e7eef6" font-size="11">${W}×${L}</text>
        </svg>
        <p class="cap">Kesik çerçeve: ${side} mm yan / ${front} mm ön / ${back} mm arka — [LAYOUT]</p>
      </div>`;
    }).join("");
    return `<div class="grid g2">${boxes}</div>`;
  }

  function completenessViz() {
    const c = DATA.completeness || { filled: 0, empty: 0, eksik: 0, total: 1, byBlock: {} };
    const R = 54, C = 2 * Math.PI * R;
    const f = (c.filled / (c.total || 1)) * C;
    const e = (c.eksik / (c.total || 1)) * C;
    const u = (c.empty / (c.total || 1)) * C;
    const donut = `<div class="card"><h3>Alan doluluk</h3>
      <svg viewBox="0 0 160 160" width="180" height="180" style="margin:0 auto">
        <g transform="translate(80,80) rotate(-90)">
          <circle r="${R}" fill="none" stroke="#10161c" stroke-width="14"/>
          <circle r="${R}" fill="none" stroke="#3ecf8e" stroke-width="14" stroke-dasharray="${f} ${C-f}"/>
          <circle r="${R}" fill="none" stroke="#e15b5b" stroke-width="14" stroke-dasharray="${e} ${C-e}" stroke-dashoffset="${-f}"/>
          <circle r="${R}" fill="none" stroke="#e0b04a" stroke-width="14" stroke-dasharray="${u} ${C-u}" stroke-dashoffset="${-(f+e)}"/>
        </g>
        <text x="80" y="84" text-anchor="middle" fill="#e7eef6" font-size="18" font-weight="700">${c.total ? Math.round(c.filled/c.total*100) : 0}%</text>
      </svg>
      <div class="legend">
        <span><i style="background:#3ecf8e"></i>Dolu ${c.filled}</span>
        <span><i style="background:#e15b5b"></i>EKSİK ${c.eksik}</span>
        <span><i style="background:#e0b04a"></i>Boş ${c.empty}</span>
      </div></div>`;
    const blocks = Object.entries(c.byBlock || {}).map(([name, st]) => {
      const tot = st.total || 1;
      return `<div class="bar-row"><span title="${esc(name)}">${esc(name)}</span>
        <div class="stack">
          <i style="width:${st.filled/tot*100}%;background:#3ecf8e"></i>
          <i style="width:${st.eksik/tot*100}%;background:#e15b5b"></i>
          <i style="width:${st.empty/tot*100}%;background:#e0b04a"></i>
        </div>
        <b>${st.filled}/${st.total}</b></div>`;
    }).join("");
    return `<div class="grid g2">${donut}<div class="card"><h3>Bloğa göre</h3>${blocks}</div></div>`;
  }

  function bomViz() {
    const bom = block("PARCA_LISTESI").bom;
    const names = Object.keys(bom);
    const cards = names.map((name, i) => {
      const rows = bom[name];
      const std = rows.filter((r) => !/opsiyon|alternatif/i.test(r.note)).length;
      const alt = rows.filter((r) => /alternatif/i.test(r.note)).length;
      const opt = rows.filter((r) => /opsiyon/i.test(r.note)).length;
      const tot = rows.length || 1;
      return `<div class="card"><h3>${esc(name)}</h3>
        <div class="stack">
          <i style="width:${std/tot*100}%;background:#5d8fd4"></i>
          <i style="width:${alt/tot*100}%;background:#e0b04a"></i>
          <i style="width:${opt/tot*100}%;background:#a78bfa"></i>
        </div>
        <div class="legend">
          <span><i style="background:#5d8fd4"></i>Standart ${std}</span>
          <span><i style="background:#e0b04a"></i>Alternatif ${alt}</span>
          <span><i style="background:#a78bfa"></i>Opsiyon ${opt}</span>
        </div>
        <p class="cap">${rows.length} satır · [PARCA_LISTESI]</p>
      </div>`;
    }).join("");
    const tableId = "bomTable";
    const all = names.flatMap((n) => bom[n].map((r) => ({ v: n, ...r })));
    const body = all.map((r) => `<tr data-q="${esc((r.v + r.code + r.name + r.note).toLowerCase())}"><td>${esc(r.v)}</td><td class="num">${esc(r.code)}</td><td>${esc(r.name)}</td><td class="num">${esc(r.qty)}</td><td>${esc(r.note)}</td></tr>`).join("");
    return `${cards ? `<div class="grid g2">${cards}</div>` : ""}
      <div class="card" style="margin-top:14px"><h3>BOM satırları</h3>
      <input type="search" placeholder="Kod, ad, varyant ara…" oninput="filterBom(this.value)" />
      <div style="overflow:auto;max-height:480px"><table><thead><tr><th>Varyant</th><th>Kod</th><th>Ad</th><th>Adet</th><th>Not</th></tr></thead><tbody id="${tableId}">${body}</tbody></table></div></div>`;
  }
  window.filterBom = (q) => {
    const s = q.trim().toLowerCase();
    document.querySelectorAll("#bomTable tr").forEach((tr) => {
      tr.style.display = !s || tr.dataset.q.includes(s) ? "" : "none";
    });
  };

  function safetyCard() {
    const items = [
      ["Acil stop adedi", kv("ACIL_DURDURMA", "Acil stop butonu adedi")],
      ["Konum", kv("ACIL_DURDURMA", "Acil stop konumları")],
      ["Stop sonrası", kv("ACIL_DURDURMA", "Acil stop sonrası makine durumu")],
      ["Kapı / bariyer", kv("GUVENLIK_CIT", "Emniyet kapısı")],
      ["Switch", kv("GUVENLIK_CIT", "Kapı switch tipi")],
      ["Stop kategorisi", kv("GUVENLIK_CIT", "Makine stop kategorisi")],
      ["Işık perdesi", kv("GUVENLIK_CIT", "Işık perdesi")],
    ];
    return `<div class="card"><h3>Güvenlik özeti</h3>
      <table>${items.map(([k,v]) => `<tr><td>${esc(k)}</td>${cell(v)}</tr>`).join("")}</table>
      <p class="cap">[ACIL_DURDURMA] · [GUVENLIK_CIT]</p></div>`;
  }

  function motorsCard() {
    const motors = block("MOTOR_SURUCU_LISTESI").motors;
    const cards = Object.entries(motors).map(([name, list]) => {
      if (!list.length) return "";
      return `<div class="card"><h3>${esc(name)} motorlar</h3>
        <table><tr><th>Ad</th><th>Güç</th><th>Devir</th><th>Marka</th><th>Model</th></tr>
        ${list.map((m) => `<tr><td>${esc(m.name)}</td><td>${esc(m.power)}</td><td>${esc(m.rpm)}</td><td>${esc(m.brand)}</td><td>${esc(m.model)}</td></tr>`).join("")}
        </table></div>`;
    }).join("");
    return cards || `<div class="card"><p class="cap">Motor satırı yok.</p></div>`;
  }

  function flowCard() {
    const steps = block("KAPASITE_PROSES").table.rows.filter((r) => /^Proses adı/i.test(r.feature));
    const vis = variants()[0];
    const i = idxOf(vis);
    const cells = steps.map((s) => s.cells[i]).filter(Boolean);
    const html = cells.map((s, n) => `<div class="step"><b>Adım ${n + 1}</b>${esc(s)}</div>`).join(`<span class="arrow">→</span>`);
    const comps = kv("MAKINE_TANIMI", "Makine bileşenleri listesi");
    const opts = kv("MAKINE_TANIMI", "Opsiyon / varyant listesi");
    return `<div class="card"><h3>Proses</h3>
      <p>${esc(kv("MAKINE_TANIMI", "Makinenin ana işlevi"))}</p>
      <div class="flow">${html || '<span class="meta">Proses adı yok</span>'}</div>
      <p class="cap">Bileşenler: ${esc(comps)}</p>
      <p class="cap">Opsiyonlar: ${esc(opts)}</p>
    </div>`;
  }

  function explorer() {
    const names = Object.keys(DATA.blocks || {});
    const options = names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
    return `<div class="card"><h3>Blok gezgini</h3>
      <div class="chips" style="margin-bottom:10px">
        <select id="blockSel" onchange="showBlock(this.value)" style="background:var(--bg);color:var(--text);border:1px solid var(--line);padding:6px 8px;border-radius:6px;font:inherit">
          ${options}
        </select>
      </div>
      <div id="blockView"></div></div>`;
  }
  window.showBlock = (name) => {
    const b = block(name);
    let html = "";
    if (b.kv.length) {
      html += `<table><tr><th>Alan</th><th>Değer</th></tr>${b.kv.map((x) => `<tr><td>${esc(x.k)}</td>${cell(x.v)}</tr>`).join("")}</table>`;
    }
    if (b.table.rows.length) {
      const cols = b.table.cols.length ? b.table.cols : (DATA.variants || []);
      html += `<table style="margin-top:12px"><tr><th>Özellik</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>
        ${b.table.rows.map((r) => `<tr><td>${esc(r.feature)}</td>${r.cells.map(cell).join("")}</tr>`).join("")}</table>`;
    }
    $("blockView").innerHTML = html || "<p class='cap'>Bu blokta tablo/alan yok (BOM veya not).</p>";
  };

  function variantBar() {
    return `<div class="chips" style="margin-bottom:14px">${(DATA.variants || []).map((v, i) =>
      `<button class="chip ${variantOn[v] !== false ? "on" : ""}" onclick="toggleV('${esc(v)}')" style="border-color:${COLORS[i % COLORS.length]}">${esc(v)}${DATA.families?.[v] ? " · " + esc(DATA.families[v]) : ""}</button>`
    ).join("")}</div>`;
  }
  window.toggleV = (v) => { variantOn[v] = variantOn[v] === false; render(); };

  function series(blockName, feat, unit) {
    return variants().map((name) => {
      const i = idxOf(name);
      return { label: name.replace("LYM ", ""), n: num(row(blockName, feat)[i]), unit };
    });
  }

  function render() {
    kpis();
    const power = series("ELEKTRIK", "Toplam kurulu güç (kW)", "kW");
    const amp = series("ELEKTRIK", "Maksimum akım çekişi", "A");
    const flow = series("KAPASITE_PROSES", "Yıkama pompası debisi", "lt/dk");
    const pk = series("KAPASITE_PROSES", "Yıkama pompası gücü — toplam", "kW");
    $("app").innerHTML = `
      ${variantBar()}
      <section id="boyut"><h2>Boyut ve kimlik</h2>
        <div class="card" style="margin-bottom:14px">
          <h3>${esc(kv("PROJE", "Makine ticari adı") || "LYM")} — ${esc(kv("MAKINE_TANIMI", "Makine tipi") || kv("GIRIS_GENEL", "Makine tipi"))}</h3>
          <p class="meta">${esc(kv("URETICI", "Üretici firma adı"))} · ${esc(kv("URETICI", "Şehir"))} · ${esc(kv("URETICI", "Web sitesi"))}</p>
          <p class="meta">Modeller: ${esc(kv("PROJE", "Makine model kodu"))}</p>
        </div>
        ${isoMachines()}
        <div style="height:14px"></div>
        ${specTable("Boyut tablosu", "BOYUT_AGIRLIK", ["Dış genişlik", "Dış uzunluk", "Dış yükseklik", "Boş ağırlık", "Çalışma ağırlığı", "Şase tipi"])}
      </section>
      <section id="elektrik"><h2>Elektrik ve pompa</h2>
        <div class="grid g2">
          ${barChart("Kurulu güç", power, "kW")}
          ${barChart("Maks. akım", amp, "A")}
          ${barChart("Pompa debisi", flow, "lt/dk")}
          ${barChart("Pompa toplam güç", pk, "kW")}
        </div>
        <div style="height:14px"></div>
        ${specTable("Elektrik", "ELEKTRIK", ["Besleme gerilimi", "Besleme frekansı", "Faz sayısı", "Toplam kurulu güç (kW)", "Toplam kurulu güç — ısıtma", "Maksimum akım", "Besleme konfigürasyonu", "Ana şalter tipi"])}
        <div style="height:14px"></div>
        ${specTable("Pompa", "KAPASITE_PROSES", ["Yıkama pompası adedi", "Yıkama pompası marka", "Yıkama pompası model", "Yıkama pompası gücü — birim", "Yıkama pompası gücü — toplam", "Yıkama pompası debisi", "Yıkama pompası nominal akım — toplam"])}
        <div style="height:14px"></div>
        ${motorsCard()}
        <div style="height:14px"></div>
        ${flowCard()}
      </section>
      <section id="yerlesim"><h2>Yerleşim ve ortam</h2>
        ${layoutCard()}
        <div style="height:14px"></div>
        ${specTable("Ortam", "ORTAM_KOSULLARI", ["Çalışma sıcaklığı", "Depolama sıcaklığı", "Göreceli nem", "Koruma sınıfı", "Gürültü seviyesi"])}
      </section>
      <section id="guvenlik"><h2>Güvenlik</h2>
        <div class="grid g2">${safetyCard()}
          <div class="card"><h3>Kontrol</h3>
            <table>
              <tr><td>Pano</td>${cell(kv("KONTROLLER", "Ana kontrol panosu konumu"))}</tr>
              <tr><td>IP</td>${cell(kv("KONTROLLER", "Pano koruma sınıfı"))}</tr>
              <tr><td>Pano ölçü</td>${cell(kv("KONTROLLER", "Pano boyutları"))}</tr>
              <tr><td>Start / Stop</td>${cell(kv("KONTROLLER", "Start / Stop"))}</tr>
              <tr><td>Acil stop</td>${cell(kv("KONTROLLER", "Acil stop konumu"))}</tr>
              <tr><td>Lambalar</td>${cell(kv("KONTROLLER", "Sinyal lambaları"))}</tr>
            </table>
          </div>
        </div>
      </section>
      <section id="doluluk"><h2>DATA doluluk</h2>${completenessViz()}</section>
      <section id="bom"><h2>Parça listesi</h2>${bomViz()}</section>
      <section id="kesfet"><h2>Tüm bloklar</h2>${explorer()}</section>
    `;
    const sel = $("blockSel");
    if (sel) showBlock(sel.value);
  }

  document.getElementById("nav").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-go]");
    if (!btn) return;
    document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("active", b === btn));
    document.getElementById(btn.dataset.go)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  DATA = (() => {
    try { return JSON.parse(document.getElementById("lym-data").textContent || "{}"); }
    catch { return {}; }
  })();
  if (!DATA.variants) DATA.variants = [];
  DATA.variants.forEach((v) => { variantOn[v] = true; });
  render();
  </script>
</body>
</html>
